<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080E" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#D4A359" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad4)" />

  <!-- Hands Cupping House Silhouette -->
  <g transform="translate(180, 220)" stroke="url(#goldGrad4)" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Left Hand -->
    <path d="M 0, 80 C 40, 70 80, 50 110, 20" />
    <!-- Right Hand -->
    <path d="M 240, 80 C 200, 70 160, 50 130, 20" />
  </g>

  <!-- House Model in Center -->
  <g transform="translate(240, 100)">
    <!-- Roof -->
    <polygon points="60,10 5,65 115,65" fill="url(#goldGrad4)" />
    <!-- Chimney -->
    <rect x="85" y="20" width="12" height="25" fill="#B8860B" />
    <!-- Body -->
    <rect x="20" y="65" width="80" height="75" fill="#F8FAFC" />
    <!-- Door -->
    <rect x="48" y="100" width="24" height="40" rx="2" fill="#1E293B" />
    <!-- Windows -->
    <rect x="30" y="80" width="16" height="16" fill="#D4A359" />
    <rect x="74" y="80" width="16" height="16" fill="#D4A359" />
  </g>
</svg>
