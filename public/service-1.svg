<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#D4A359" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad1)" />
  
  <!-- Desk surface -->
  <path d="M 0, 260 L 600, 260 L 600, 400 L 0, 400 Z" fill="#151311" />
  <line x1="0" y1="260" x2="600" y2="260" stroke="#D4A359" stroke-width="1.5" opacity="0.4" />

  <!-- Lawyer & Client Silhouettes & Documents -->
  <g transform="translate(60, 90)">
    <path d="M 40, 180 L 80, 100 C 90, 80 130, 80 140, 100 L 180, 180 Z" fill="#1E293B" />
    <circle cx="110" cy="55" r="22" fill="#E2E8F0" opacity="0.8" />
  </g>
  <g transform="translate(240, 70)">
    <path d="M 40, 200 L 90, 110 C 100, 90 140, 90 150, 110 L 200, 200 Z" fill="#0F172A" />
    <circle cx="120" cy="60" r="24" fill="#CBD5E1" opacity="0.9" />
  </g>

  <!-- Legal Documents on desk -->
  <polygon points="220,270 340,255 350,330 230,345" fill="#F8FAFC" opacity="0.9" />
  <line x1="240" y1="280" x2="320" y2="270" stroke="#64748B" stroke-width="2" />
  <line x1="240" y1="295" x2="330" y2="285" stroke="#64748B" stroke-width="2" />
  <line x1="240" y1="310" x2="300" y2="300" stroke="#64748B" stroke-width="2" />

  <!-- Lady Justice statue silhouette (Right) -->
  <g transform="translate(480, 140) scale(0.65)" opacity="0.7">
    <line x1="50" y1="40" x2="50" y2="200" stroke="url(#goldGrad1)" stroke-width="3" />
    <line x1="10" y1="70" x2="90" y2="70" stroke="url(#goldGrad1)" stroke-width="3" />
    <path d="M 10,70 L -10,120 L 30,120 Z" fill="none" stroke="url(#goldGrad1)" stroke-width="2" />
    <path d="M 90,70 L 70,120 L 110,120 Z" fill="none" stroke="url(#goldGrad1)" stroke-width="2" />
  </g>
</svg>
